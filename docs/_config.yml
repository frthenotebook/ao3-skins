lsi: false
incremental: false
highlighter: rouge
gist:
  noscript: false
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

plugins:
  - jekyll-include-cache
  # - jekyll-remote-theme # add this line to the plugins list if you already have one
  
title: AO3 Skins
description: "@frthenotebook's skins"
theme: just-the-docs

url: https://frthenotebook.github.io/ao3-skins

aux_links:
  "Codes": "https://github.com/frthenotebook/ao3-skins"

nav_enabled: true
heading_anchors: true
enable_copy_code_button: true

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Footer last edited timestamp
last_edit_timestamp: true # show or hide edit time - page must have `last_modified_date` defined in the frontmatter
last_edit_time_format: "%b %e %Y" # uses ruby's time format: https://ruby-doc.org/stdlib-2.7.0/libdoc/time/rdoc/Time.html

callouts:
  warning:
    title: Warning
    color: red
  tip:
    title: Tip
    color: green
  note:
    title: Note
    color: purple

collections:
  overview:
    permalink: "/:collection/:path/"
    output: true
  util:
    permalink: "/:collection/:path/"
    output: true
  # theme:
  #   permalink: "/:collection/:path/"
  #   output: true

just_the_docs:
  collections:
    overview:
      name: Overview
      # nav_exclude: true
      # nav_fold: true
      # search_exclude: true
    util:
      name: Utility Skins
      # nav_exclude: true
      # nav_fold: true
      # search_exclude: true
    # theme:
    #   name: Theme Site Skins
      # nav_exclude: true
      # nav_fold: true
      # search_exclude: true
